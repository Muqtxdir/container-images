name: os-images
description: Add the runtime config and labels to a container-fs image, and push it under every tag.

inputs:
  source:
    description: Base image.
    required: true
  repository:
    description: Where to push.
    required: true
  tags:
    description: Tags to push, separated by spaces.
    required: true

outputs:
  images:
    description: The pushed image as <repository>@<digest>.
    value: ${{ steps.push.outputs.images }}

runs:
  using: composite
  steps:
    - id: push
      shell: bash
      env:
        ARCHITECTURE: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
        SOURCE: ${{ inputs.source }}
        REPOSITORY: ${{ inputs.repository }}
        TAGS: ${{ inputs.tags }}
      run: |
        images=$(
          docker run --rm \
            --volume "$HOME/.docker:/docker:ro" \
            --env DOCKER_CONFIG=/docker \
            --env GITHUB_SERVER_URL \
            --env GITHUB_REPOSITORY \
            --env GITHUB_REPOSITORY_OWNER \
            --env GITHUB_SHA \
            "ghcr.io/muqtxdir/container-images/os-images:$ARCHITECTURE" \
            --source="$SOURCE" \
            --repository="$REPOSITORY" \
            --tags="$TAGS"
        )
        {
          echo "images<<EOF"
          echo "$images"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
