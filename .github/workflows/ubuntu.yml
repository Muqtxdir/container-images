name: ubuntu

on:
  push:
    branches: [main]
    paths:
      - os-images/**
      - go.mod
      - go.sum
      - .github/workflows/ubuntu.yml
      - .github/workflows/os-images.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    uses: ./.github/workflows/os-images.yml
    with:
      distro: ubuntu
      images: |
        [
          {"variant": "lts", "tags": "lts latest resolute main 26.04"},
          {"variant": "rolling", "tags": "rolling stonking 26.10"}
        ]
