name: ubuntu

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ubuntu.yml
      - .github/workflows/os-images.yml
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/os-images.yml
    with:
      distro: ubuntu
      images: |
        [
          {"variant": "lts", "tags": "lts latest resolute main 26.04"},
          {"variant": "rolling", "tags": "rolling stonking 26.10"}
        ]
