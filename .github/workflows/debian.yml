name: debian

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debian.yml
      - .github/workflows/os-images.yml
  workflow_run:
    workflows: [image]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/os-images.yml
    with:
      distro: debian
      images: |
        [
          {"variant": "stable", "tags": "stable latest main"},
          {"variant": "testing", "tags": "testing"},
          {"variant": "unstable", "tags": "unstable"}
        ]
