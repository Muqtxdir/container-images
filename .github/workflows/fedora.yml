name: fedora

on:
  push:
    branches: [main]
    paths:
      - os-images/**
      - go.mod
      - go.sum
      - .github/workflows/fedora.yml
      - .github/workflows/os-images.yml
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  images:
    uses: ./.github/workflows/os-images.yml
    with:
      distro: fedora
      images: |
        [
          {"variant": "latest", "tags": "latest"},
          {"variant": "rawhide", "tags": "rawhide"}
        ]
